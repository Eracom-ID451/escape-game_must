<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>M.U.S.T – Plan de l’appartement</title>
	<link rel="stylesheet" href="../shared/css/win95.css">
	<link rel="stylesheet" href="css/controle.css">
	<style>
		/* Plan de l’appartement : même grande fenêtre que les stations, centrée */
		.plan .stage {
			background-image: url("assets/bg-plan.png");
		}

		.plan {
			--win-x: 195px;
			--win-y: 72px;
			--win-w: 1530px;
		}

		/* Pas de texture de verre sur cet écran */
		.plan .stage::before {
			display: none;
		}

		/* Même plan que la carte de l’aspirateur (export Figma à 3×) */
		.plan__image {
			position: absolute;
			left: 695px;
			top: 221px;
			width: 529.82px;
			height: 709.26px;
		}
	</style>
</head>
<body class="plan">
	<main class="stage">
		<section class="window window--station relief-window" aria-labelledby="plan-title">
			<header class="titlebar">
				<h1 class="titlebar__title" id="plan-title">Plan de l’appartement</h1>
				<span class="titlebar__btn titlebar__btn--min relief-button" aria-hidden="true"></span>
				<span class="titlebar__btn titlebar__btn--max relief-button" aria-hidden="true"><img src="assets/icon-maximize.svg" alt=""></span>
				<a class="titlebar__btn titlebar__btn--close relief-button" href="menu.html" aria-label="Fermer"><img src="assets/icon-close.svg" alt=""></a>
			</header>
		</section>

		<img class="plan__image" src="assets/plan.png" alt="Plan de l’appartement : salon, entrée, chambre 1, cuisine, chambre 2, salle de bain">
	</main>
	<script src="../shared/js/stage.js"></script>
</body>
</html>
