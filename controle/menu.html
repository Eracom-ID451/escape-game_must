	<script>
		// Horloge de la barre des tâches
		const clock = document.querySelector(".taskbar__clock");
		function tick() {
			const now = new Date();
			const h = now.getHours() % 12 || 12;
			const m = String(now.getMinutes()).padStart(2, "0");
			clock.textContent = `${h}:${m}${now.getHours() < 12 ? "AM" : "PM"}`;
		}
		tick();

		// Statut des stations : « Connecté » et la lettre gagnée une fois la station réussie
		// (voir js/station.js). Ouvrir menu.html?reset remet le jeu à zéro.
		const LETTERS = { frigo: "H", aspirateur: "I", miroir: "E", reveil: "C", thermostat: "N" };

		if (new URLSearchParams(location.search).has("reset")) {
			try {
				Object.keys(LETTERS).forEach((id) => localStorage.removeItem(`must:${id}`));
			} catch (error) {}
			history.replaceState(null, "", location.pathname);
		}

		function solved(id) {
			try { return localStorage.getItem(`must:${id}`) === "1"; } catch (error) { return false; }
		}

		function renderStatus() {
			for (const [id, letter] of Object.entries(LETTERS)) {
				const mini = document.querySelector(`.mini--${id}`);
				if (!mini) continue;
				const ok = solved(id);
				mini.classList.toggle("is-connected", ok);
				mini.querySelector(".mini__status img").src = ok ? "assets/icon-connected.png" : "assets/icon-warning.png";
				mini.querySelector(".mini__label").textContent = ok ? "Connecté" : "Déconnecté";
				mini.querySelector(".mini__letter").textContent = ok ? `(${letter})` : "";
			}

			// Énigme bonus : verrouillée tant que les cinq stations ne sont pas réussies
			const allSolved = Object.keys(LETTERS).every(solved);
			const bonus = document.querySelector(".taskbar__bonus");
			bonus.classList.toggle("is-locked", !allSolved);
			if (allSolved) bonus.setAttribute("href", "bonus.html");
			else bonus.removeAttribute("href");
			bonus.setAttribute("aria-disabled", String(!allSolved));
		}

		renderStatus();
		window.addEventListener("pageshow", renderStatus); // retour arrière depuis une station
		setInterval(tick, 10000);
	</script>
