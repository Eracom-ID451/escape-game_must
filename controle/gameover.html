<head>

	<link rel="stylesheet" href="../shared/css/win95.css">

		.stage {

		<p class="logo" style="top: -3px">M.U.S.T</p>

		<!-- Nouvelle partie : stations « Déconnecté », compte à rebours arrêté, retour à l’accueil -->
		<a class="btn btn--screen" href="index.html?reset" style="left: 720px; top: 700px; width: 480px; white-space: nowrap">Nouvelle partie</a>

	<script src="../shared/js/stage.js"></script>
